name: Remove tracked runtime artifacts

on:
  push:
    branches:
      - codex/v1.3-data-safe-production-workflow

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1.3-data-safe-production-workflow
          fetch-depth: 0
      - name: Remove generated and local runtime state from Git index
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files 'dist/**' 'data/**' '*.sqlite' '*.sqlite-wal' '*.sqlite-shm' || true)"
          if [ -z "$tracked" ]; then
            echo 'No tracked runtime artifacts remain.'
            exit 0
          fi
          git rm -r --cached --ignore-unmatch dist data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(security): remove tracked runtime data and build output'
          git push origin HEAD:codex/v1.3-data-safe-production-workflow
