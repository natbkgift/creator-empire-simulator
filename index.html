<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080c14">
  <meta name="description" content="Creator Empire Simulator — mission-first creator operating system with local SQLite reliability">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="./styles/app.css">
  <title>Creator Empire Simulator</title>
</head>
<body>
  <div id="app">
    <div class="startup-screen" role="status" aria-live="polite" aria-label="Opening Creator Empire workspace">
      <main class="startup-shell">
        <div class="startup-brand"><span class="startup-mark" aria-hidden="true">CE</span><span><strong>Creator Empire</strong><small>Creator operating system</small></span></div>
        <div class="startup-copy">
          <span class="eyebrow">Preparing your workspace</span>
          <h1>Opening Creator OS</h1>
          <p>กำลังเชื่อมต่อ SQLite และตรวจสอบ Browser recovery mirror โดยไม่เปลี่ยนข้อมูลของคุณ</p>
        </div>
        <div class="startup-progress" aria-hidden="true"><span></span></div>
        <small class="startup-hint">ปกติใช้เวลาเพียงไม่กี่วินาที</small>
      </main>
    </div>
  </div>
  <noscript>Creator Empire Simulator requires JavaScript.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
